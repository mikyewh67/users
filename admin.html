<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HandleVault Admin</title><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap" style="padding:60px 0;max-width:760px"><div class="eyebrow">PRIVATE ADMIN</div><h1 style="font-size:52px;margin:0 0 30px">Order fulfillment</h1><section class="modal-card" style="margin:0;width:100%"><label>Admin secret<input id="secret" type="password"></label><label>Order ID<input id="oid" placeholder="Order ID"></label><button id="load" class="button full">Load order</button><div id="result" class="status"></div><div id="actions" style="display:none"><hr style="border:0;border-top:1px solid #333;margin:25px 0"><label>Transfer details / instructions<textarea id="details" style="min-height:180px" placeholder="Transfer instructions, one-time details, recovery handoff, etc."></textarea></label><button id="fulfill" class="button full">Verify paid + fulfill by email</button><button id="release" class="ghost full" style="margin-top:8px">Release / cancel order</button><p class="muted">Only click fulfill after you have independently verified the payment and secured the handle for the buyer.</p></div></section></main><script>
const $=s=>document.querySelector(s);let current=null;const post=(u,b)=>fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j});function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
$('#load').onclick=async()=>{try{const j=await post('/api/admin-order',{adminSecret:$('#secret').value,orderId:$('#oid').value});current=j.order;const o=current,i=o.inventory;$('#result').className='status ok';$('#result').innerHTML=`<b>${esc(i.handle)}</b> — $${i.sale_price}<br>Status: ${esc(o.status)}<br>Supplier: ${esc(i.source)} / cost $${i.cost}<br>Buyer: ${esc(o.buyer_email)}<br>Payment: ${esc(o.payment_method)} / ${esc(o.payer_name)}<br>Reference: ${esc(o.payment_ref)}<br>Gross spread: $${Number(i.sale_price)-Number(i.cost)}`;$('#actions').style.display=o.status==='pending'?'block':'none'}catch(e){$('#result').className='status err';$('#result').textContent=e.message;$('#actions').style.display='none'}};
$('#fulfill').onclick=async()=>{if(!current)return;try{await post('/api/fulfill',{adminSecret:$('#secret').value,orderId:current.public_id,transferDetails:$('#details').value});$('#result').className='status ok';$('#result').textContent='Fulfilled and emailed successfully.';$('#actions').style.display='none'}catch(e){$('#result').className='status err';$('#result').textContent=e.message}};
$('#release').onclick=async()=>{if(!current||!confirm('Release this order and put the handle back for sale?'))return;try{await post('/api/release',{adminSecret:$('#secret').value,orderId:current.public_id});$('#result').className='status ok';$('#result').textContent='Order released.';$('#actions').style.display='none'}catch(e){$('#result').className='status err';$('#result').textContent=e.message}};
</script></body></html>
